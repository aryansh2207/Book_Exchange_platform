<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<style>
  body {
    margin: 0; font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #2c3e50, #4b6584);
    display: flex; align-items: center; justify-content: center; height: 100vh;
  }
  .login-box {
    background: #fff; padding: 35px 40px; border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25); width: 100%; max-width: 350px;
  }
  .login-box h1 { text-align: center; color: #2c3e50; margin-top: 0; font-size: 24px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-weight: bold; margin-bottom: 6px; color: #333; font-size: 14px; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px;
  }
  .options { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 20px; }
  .options a { color: #4b6584; text-decoration: none; }
  .options a:hover { text-decoration: underline; }
  button {
    width: 100%; padding: 11px; background: #2c3e50; color: #fff; border: none;
    border-radius: 5px; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #1f2c38; }
  .signup { text-align: center; margin-top: 16px; font-size: 13px; color: #555; }
  .signup a { color: #2c3e50; font-weight: bold; text-decoration: none; }
</style>
</head>
<body>
  <div class="login-box">
    <h1>Welcome Back</h1>
    <form action="#" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      <div class="options">
        <label><input type="checkbox" name="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit">Login</button>
    </form>
    <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
  </div>
</body>
</html>
